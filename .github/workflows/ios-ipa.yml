name: iOS-App bauen (IPA)
# Baut eine unsignierte IPA auf einem Mac-Rechner von GitHub (für öffentliche Repos kostenlos).
# Signieren & installieren dann mit Sideloadly oder AltStore und deiner Apple-ID.
on:
  workflow_dispatch: {}
  release:
    types: [published]
permissions:
  contents: write
concurrency: { group: ios-ipa, cancel-in-progress: true }
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: iOS-Projekt erzeugen
        run: npx expo prebuild --platform ios --clean
        env: { CI: 1 }
      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild -quiet \
            -workspace ios/Stoerungsmelder.xcworkspace -scheme Stoerungsmelder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: IPA packen
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Stoerungsmelder.app Payload/
          zip -qry "Stoerungsmelder-$VERSION.ipa" Payload
          echo "file=Stoerungsmelder-$VERSION.ipa" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.file }}
          path: ${{ steps.pack.outputs.file }}
          retention-days: 30
      - name: AltStore-Quelle erzeugen
        if: github.event_name == 'release'
        run: |
          plutil -convert json -o info.json Payload/Stoerungsmelder.app/Info.plist
          node scripts/make-altstore-source.mjs info.json "${{ steps.pack.outputs.file }}" source.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
      - name: An Release anhängen
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pack.outputs.file }}" source.json --clobber
        env: { GH_TOKEN: '${{ github.token }}' }
