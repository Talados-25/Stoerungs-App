name: Diagnose Statusquellen
on:
  push:
    branches: [claude/diag-statusquellen]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: claude/v1.4.0-datev-docuware }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Neue Pruefungen gegen echte Schnittstellen
        run: |
          node --input-type=module -e "
          import { CATALOG, checkService } from './shared/checks.js';
          for (const id of ['datev','docuware','odav']) {
            const r = await checkService(CATALOG.find(c => c.id === id));
            console.log('ERGEBNIS', r.level.padEnd(11), r.name, '–', r.message);
            for (const i of r.incidents) console.log('    •', i);
          }"
