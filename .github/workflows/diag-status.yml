name: Diagnose Statusquellen
on:
  push:
    branches: [claude/diag-statusquellen]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DocuWare tiefer
        shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          B=https://statusportal.docuware.cloud
          curl -sSL -m 20 -A "$UA" "$B/main-FTWO4WFG.js" -o main.js
          echo "== main.js"; cat main.js; echo
          for c in $(grep -oE 'chunk-[A-Z0-9]+\.js' main.js | sort -u); do
            curl -sSL -m 20 -A "$UA" "$B/$c" -o c.js
            echo "== $c $(wc -c < c.js)"
            grep -oE '"[^"]{0,20}(https?://|/api|api/|\.json|/v1/|/v2/)[^"]{0,150}"|`[^`]{0,20}(https?://|/api|api/|/v1/)[^`]{0,150}`' c.js | grep -viE 'w3\.org|angular\.(dev|io)|github\.com|mozilla' | sort -u | head -30
          done
