name: Diagnose Statusquellen
on:
  push:
    branches: [claude/diag-statusquellen]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kandidaten pruefen
        shell: bash {0}
        run: |
          probe() {
            u="$1"
            r=$(curl -sSL -m 15 -o /tmp/body -w '%{http_code} %{url_effective}' -A 'Mozilla/5.0' "$u" 2>&1)
            sig=$(grep -oiE 'statuspage|atlassian|instatus|betteruptime|betterstack|status\.io|uptimerobot|hund\.io|sorryapp|cachet|statuscast|openstatus|incident\.io|<title>[^<]{0,80}' /tmp/body 2>/dev/null | sort -u | tr '\n' ' ' | head -c 300)
            echo "PROBE $u → $r | $sig"
          }
          for b in https://status.docuware.com https://status.docuware.cloud https://docuware.statuspage.io https://www.docuware-status.com https://status.docuware.net https://trust.docuware.com \
                   https://status.odav.de https://status.odav.net https://odav.statuspage.io https://www.odav.de https://www.odav.de/status https://www.odav.de/stoerungen https://status.odav.cloud; do
            probe "$b"
            r=$(curl -sS -m 15 -A 'Mozilla/5.0' "$b/api/v2/summary.json" 2>&1 | head -c 200 | tr '\n' ' ')
            echo "JSON $b → $r"
          done
      - name: DATEV-Seite analysieren
        shell: bash {0}
        run: |
          curl -sSL -m 20 -A 'Mozilla/5.0' https://www.datev-status.de/ -o datev.html
          echo "GROESSE $(wc -c < datev.html)"
          echo "== Links auf Daten (json/xml/rss/feed/api)"
          grep -oiE '(href|src)="[^"]*"' datev.html | grep -iE 'json|xml|rss|feed|api|\.js' | sort -u | head -40
          grep -oiE 'https?://[^"'"'"' )]*(json|rss|feed|api)[^"'"'"' )]*' datev.html | sort -u | head -20
          echo "== Textauszug"
          sed -e 's/<[^>]*>/ /g' datev.html | tr -s ' \n' | head -c 2500
          echo
          for f in feed rss rss.xml feed.xml atom.xml index.xml data.json status.json api/status incidents.json; do
            r=$(curl -sS -m 10 -o /tmp/f -w '%{http_code} %{content_type}' -A 'Mozilla/5.0' "https://www.datev-status.de/$f" 2>&1)
            echo "DATEVPROBE /$f → $r | $(head -c 150 /tmp/f | tr '\n' ' ')"
          done
