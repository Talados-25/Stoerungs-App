name: Diagnose Statusquellen
on:
  push:
    branches: [claude/diag-statusquellen]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DocuWare Daten
        shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          B=https://statusportal.docuware.cloud
          curl -sS -m 20 -A "$UA" -w '\nHTTP %{http_code} %{content_type}\n' "$B/api/v2025-06-13/RegionalStatus/all" | head -c 6000
          echo
          echo "== Statuswerte im Skript"
          curl -sSL -m 20 -A "$UA" "$B/chunk-IA4ANFFS.js" -o o.js
          grep -oE '.{0,80}(status|Status|state|State)[^;]{0,160}' o.js | grep -iE 'operational|degrad|outage|maint|incident|available|disrupt|healthy|warning|critical' | sort -u | head -25
